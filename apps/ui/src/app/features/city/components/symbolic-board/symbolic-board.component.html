<div class="board-shell" role="img" aria-label="Symbolic simulation board">
  <div class="board-grid"></div>

  <svg class="interaction-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
    @for (interaction of interactions; track interaction.key) {
      <line
        [attr.x1]="interaction.fromLeftPct"
        [attr.y1]="interaction.fromTopPct"
        [attr.x2]="interaction.toLeftPct"
        [attr.y2]="interaction.toTopPct"
        [attr.class]="'interaction interaction--' + interaction.kind"
      ></line>
    }
  </svg>

  @for (place of places; track place.id) {
    <div
      class="place-anchor"
      [style.left.%]="place.leftPct"
      [style.top.%]="place.topPct"
      [attr.aria-label]="place.label"
    >
      <span class="place-dot"></span>
      <span class="place-label">{{ place.label }}</span>
    </div>
  }

  @for (eventMarker of eventMarkers; track eventMarker.eventId) {
    <button
      type="button"
      class="event-marker"
      [class.event-marker--milestone]="eventMarker.tone === 'milestone'"
      [style.left.%]="eventMarker.leftPct"
      [style.top.%]="eventMarker.topPct"
      (click)="onEventMarkerClick(eventMarker.eventId)"
      [attr.aria-label]="'Event marker ' + eventMarker.label"
    >
      <span>●</span>
    </button>
  }

  @for (marker of markers; track trackByMarkerId($index, marker)) {
    <button
      type="button"
      class="marker"
      [class.marker--busy]="marker.state === 'busy'"
      [class.marker--selected]="selectedHumanId === marker.id"
      [class.marker--tracked]="trackedHumanId === marker.id"
      [style.left.%]="marker.leftPct"
      [style.top.%]="marker.topPct"
      (click)="onMarkerClick(marker.id)"
      [attr.aria-label]="'Select ' + marker.name"
    >
      <span class="marker-dot"></span>
      <span class="marker-label">{{ marker.name }}</span>
    </button>
  }
</div>
