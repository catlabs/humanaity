spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional local bootstrap account for manual login and smoke checks.
# Set HUMANAITY_API_EMAIL and HUMANAITY_API_PASSWORD in your local env when needed.
humanaity.auth.bootstrap.users[0].email=${HUMANAITY_API_EMAIL:}
humanaity.auth.bootstrap.users[0].password=${HUMANAITY_API_PASSWORD:}
humanaity.auth.bootstrap.users[0].roles[0]=ROLE_USER
