spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/humanaity}
spring.datasource.username=${DB_USERNAME:humanaity}
spring.datasource.password=${DB_PASSWORD:humanaity}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
